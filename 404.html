<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">


<!-- =========================
     SEO
========================= -->

<title>404 - Halaman Tidak Ditemukan | Roblox Indonesia</title>

<meta name="description"
      content="Halaman yang Anda cari tidak ditemukan di Roblox Indonesia.">

<meta name="robots"
      content="noindex, nofollow">

<meta name="googlebot"
      content="noindex, nofollow">

<meta name="theme-color"
      content="#202124">


<!-- =========================
     FAVICON
========================= -->

<link rel="icon"
      type="image/png"
      sizes="48x48"
      href="https://robloxindonesia.github.io/favicon.png">

<link rel="icon"
      type="image/svg+xml"
      href="https://robloxindonesia.github.io/favicon.svg">

<link rel="apple-touch-icon"
      href="https://robloxindonesia.github.io/favicon.png">


<!-- =========================
     CSS
========================= -->

<link rel="stylesheet"
      href="https://robloxindonesia.github.io/style/halaman-utama.css">


<style>

/* =========================
   HALAMAN 404
========================= */

.error-page {

    min-height: 55vh;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 40px 20px;

    text-align: center;

}


.error-content {

    width: 100%;

    max-width: 600px;

}


.error-code {

    margin: 0;

    font-size: 100px;

    font-weight: 800;

    line-height: 1;

    color: #ff0000;

}


.error-title {

    margin: 20px 0 0;

    font-size: 28px;

    font-weight: 700;

    color: #fff;

}


.error-description {

    margin: 12px 0 0;

    font-size: 16px;

    line-height: 1.6;

    color: #aaa;

}


.error-button {

    display: inline-block;

    margin-top: 25px;

    padding: 12px 24px;

    border-radius: 8px;

    background: #ff0000;

    color: #fff;

    text-decoration: none;

    font-size: 15px;

    font-weight: 600;

    transition: 0.2s;

}


.error-button:hover {

    opacity: 0.85;

    transform: translateY(-1px);

}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    .error-page {

        min-height: 50vh;

        padding: 30px 20px;

    }


    .error-code {

        font-size: 75px;

    }


    .error-title {

        font-size: 23px;

    }


    .error-description {

        font-size: 14px;

    }


    .error-button {

        padding: 11px 20px;

        font-size: 14px;

    }

}

</style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<div class="header">

    <div class="header1">

        <button
            class="menu-btn"
            onclick="openMenu()">
            ☰
        </button>


        <div id="logo1"></div>


        <div class="right-icons">

            <div id="profiles"></div>

            <div class="search">
                ⌕
            </div>

        </div>

    </div>


    <!-- =========================
         NAV
    ========================= -->

    <div class="nav">

        <a id="link1"></a>

        <a id="link2"></a>

        <a id="link3"></a>

        <a id="link4"></a>

    </div>

</div>


<!-- =========================
     SIDEBAR
========================= -->

<div
    id="menuDropdown"
    class="sidebar">


    <div class="close-btn1">

        <div id="logo2"></div>

        <span
            class="close-btn"
            onclick="closeMenu()">
            ×
        </span>

    </div>


    <a id="link9"></a>

    <a id="link10"></a>

    <a id="link11"></a>

    <a id="link12"></a>

    <a id="link13"></a>

    <a id="link14"></a>

    <a id="link15"></a>

    <a id="link16"></a>

</div>


<!-- =========================
     404 CONTENT
========================= -->

<div class="error-page">

    <div class="error-content">


        <h1 class="error-code">
            404
        </h1>


        <h2 class="error-title">
            Halaman Tidak Ditemukan
        </h2>


        <p class="error-description">
            Maaf, halaman yang Anda cari tidak tersedia
            atau mungkin sudah dipindahkan.
        </p>


        <a
            href="https://robloxindonesia.github.io/"
            class="error-button">

            Kembali ke Beranda

        </a>


    </div>

</div>


<!-- =========================
     FOOTER
========================= -->

<div class="footer-links">

    <a id="link5"></a>

    <a id="link6"></a>

    <a id="link7"></a>

    <a id="link8"></a>

</div>


<hr>


<div
    id="text1"
    class="copyright">
</div>


<div
    id="text2"
    class="copyright">
</div>


<!-- =========================
     JAVASCRIPT
========================= -->

<script src="https://robloxindonesia.github.io/script/halaman-utama.js"></script>


</body>

</html>
